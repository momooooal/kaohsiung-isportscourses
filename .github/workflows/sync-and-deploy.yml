name: Sync iSports and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - artifacts/kaohsiung-sport-courses/public/data/**
  schedule:
    # Asia/Taipei 06:37 and 15:37 (UTC 22:37 and 07:37)
    - cron: '37 22,7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-sync.txt

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-sync.txt
          playwright install --with-deps chromium

      - name: Synchronize official iSports regular courses
        id: sync_courses
        continue-on-error: true
        env:
          ISPORTS_HEADLESS: '1'
          ISPORTS_YEAR_OFFSETS: '0,1'
        run: python scripts/sync_isports.py

      - name: Synchronize official iSports series activities
        id: sync_series
        continue-on-error: true
        env:
          ISPORTS_HEADLESS: '1'
          ISPORTS_YEAR_OFFSETS: '0,1'
        run: python scripts/sync_series_activities.py

      - name: Report synchronization fallback
        if: steps.sync_courses.outcome == 'failure' || steps.sync_series.outcome == 'failure'
        run: echo "At least one synchronization step failed; deploying the most recent successful JSON already in the repository."

      - name: Commit synchronized JSON when changed
        if: always()
        run: |
          if git diff --quiet -- artifacts/kaohsiung-sport-courses/public/data; then
            echo "No synchronized data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/kaohsiung-sport-courses/public/data
          git commit -m "chore: sync iSports course and series data [skip ci]"
          git push || echo "Warning: synchronized data could not be pushed, but this run will still deploy it."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @workspace/kaohsiung-sport-courses run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/kaohsiung-sport-courses/dist/public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
